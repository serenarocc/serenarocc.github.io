<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente coordinato al tuo sito (Ciano -> Magenta) -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009dff" />
      <stop offset="100%" stop-color="#ff00ff" />
    </linearGradient>
  </defs>

  <!-- Sfondo dark con angoli arrotondati stile finestra terminale -->
  <rect width="100" height="100" rx="24" fill="#0b0f19" />

  <!-- Prompt CLI: ">" -->
  <path d="M 28 32 L 48 50 L 28 68" 
        fill="none" 
        stroke="url(#cyberGrad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Cursore lampeggiante: "_" -->
  <line x1="56" y1="68" x2="76" y2="68" 
        stroke="url(#cyberGrad)" 
        stroke-width="9" 
        stroke-linecap="round" />
</svg>
